# Production Compose deployment for Coolify on Hetzner. Coolify supplies TLS and
# reverse proxying; only `app` is exposed to it. Do not add a second proxy here.
#
# Required Coolify environment variables (no production defaults are provided):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   DATABASE_URL, DATABASE_ADMIN_URL, REDIS_URL
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
# DATABASE_URL must use the non-BYPASSRLS `lingua_app` role. DATABASE_ADMIN_URL
# is reserved for migrations/RLS administration and must not be used by app code.
#
# AI_SERVICE_URL is deliberately OPTIONAL, defaulting to empty. Leaving it unset
# is Manual tier (AGENTS.md rule 7): submissions route to pending_review instead
# of grading — see server/workers/normalization-runtime.ts. Only set it once the
# `ai` profile below is actually running on hardware sized for it.
#
# ai-service sits behind the `ai` Compose profile and will NOT build or start on
# a plain `docker compose -f docker-compose.prod.yml up`. Enable it explicitly
# with `--profile ai` once the box has the RAM/GPU for Whisper + Wav2Vec2 + MFA
# loaded concurrently — only then are AI_TRANSCRIBE_MODEL, AI_TRANSCRIBE_DEVICE,
# AI_TRANSCRIBE_COMPUTE_TYPE, AI_REQUIRE_VAD, AI_PRONUNCIATION, AI_PHONEME_MODEL
# required.
#
# Minimum host for the `ai` profile: 4 vCPU / 16GB RAM (e.g. Hetzner CCX23).
# Measured directly (see docs/active-work.md): the app + both workers idle at
# ~500MB, and silero-vad alone (torch + CUDA deps, even on a CPU box) plus a
# loaded Faster-Whisper "small" model needs several GB of real headroom on
# top of that — a 1GB container OOM-killed repeatedly under real load. The
# mem_limit values below are sized with that margin, not guessed; don't
# shrink ai-service's limit without re-testing under real transcription
# load, not just an idle health check (health checks stay green with the
# model unloaded — Whisper loads lazily on first request).

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Role + auth-shim bootstrap; runs once for an empty data directory.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot schema + policy gate. Runs to completion before the app or the
  # workers start, then exits.
  #
  # Nothing else in this stack applied migrations, so a deploy shipped new code
  # against an older schema and — worse — never applied RLS policy changes. RLS
  # is the product (Iron Law 1): a policy fixed in the repo but not on the
  # server is not fixed. Uses the worker target because it carries the full
  # source and dev dependencies (drizzle-kit, tsx); the runner stage is a
  # trimmed standalone build that cannot run either.
  #
  # `db:migrate` applies pending SQL migrations; `rls:apply` is separate and
  # NOT generated by Drizzle — it re-applies every policy file idempotently.
  # Both need the admin connection, since the app role is deliberately
  # non-BYPASSRLS and cannot alter policies.
  migrate:
    build:
      context: .
      target: worker
    command: ["sh", "-c", "pnpm db:migrate && pnpm rls:apply"]
    restart: "no"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?DATABASE_ADMIN_URL is required}

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?DATABASE_ADMIN_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      HOSTNAME: "0.0.0.0"
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}

    # No published host port: Traefik routes to container port 8080 over the
    # coolify network (see the labels below). The old "3000:3000" mapping
    # pointed at a port nothing listens on, and publishing the app directly
    # would bypass TLS termination anyway.
    networks:
      - default
      - coolify
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.lingualab.rule=Host(`lingualab.routelapps.com.ng`)"
      - "traefik.http.routers.lingualab.entrypoints=https"
      - "traefik.http.routers.lingualab.tls=true"
      - "traefik.http.routers.lingualab.tls.certresolver=letsencrypt"
      - "traefik.http.services.lingualab.loadbalancer.server.port=8080" 

  normalization-worker:
    build:
      context: .
      target: worker
    command: ["pnpm", "worker:normalization"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?DATABASE_ADMIN_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      NORMALIZATION_WORKER_CONCURRENCY: ${NORMALIZATION_WORKER_CONCURRENCY:?NORMALIZATION_WORKER_CONCURRENCY is required}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}

  grading-worker:
    build:
      context: .
      target: worker
    command: ["pnpm", "worker:grading"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?DATABASE_ADMIN_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      # GPU-bound Wav2Vec2 inference is deliberately fixed at one job (Iron Law 6).
      GRADING_WORKER_CONCURRENCY: "1"

  ai-service:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    restart: unless-stopped
    # See the sizing note above the `ai` profile comment block — this needs
    # real headroom, not a guess based on the model's on-disk size.
    mem_limit: 8g
    cpus: 3.0
    environment:
      # Defaults match the CPU tier (AGENTS.md ai-pipeline rules), sized for a
      # small CPU-only box, not the dev-compose "medium" default. Override in
      # Coolify only after confirming real memory headroom on this host.
      AI_TRANSCRIBE_MODEL: ${AI_TRANSCRIBE_MODEL:-small}
      AI_TRANSCRIBE_DEVICE: ${AI_TRANSCRIBE_DEVICE:-cpu}
      AI_TRANSCRIBE_COMPUTE_TYPE: ${AI_TRANSCRIBE_COMPUTE_TYPE:-int8}
      AI_REQUIRE_VAD: ${AI_REQUIRE_VAD:-false}
      AI_PRONUNCIATION: ${AI_PRONUNCIATION:-false}
      AI_PHONEME_MODEL: ${AI_PHONEME_MODEL:-facebook/wav2vec2-lv-60-espeak-cv-ft}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}

volumes:
  pgdata:

networks:
  default:
  coolify:
    external: true
