name: CI

on:
  push:
    branches: [main]
  pull_request:

# AGENTS.md Iron Law 1: RLS is the product. This workflow's rls-tests step is
# the automated form of that rule — it must run through the real Drizzle
# connection (packages/db/src/rls-tests/**), not a mocked one, and it must be
# required before merge. Do not weaken it to "continue-on-error" to unblock a
# red build; fix the policy or the test instead.

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: lingua_admin
          POSTGRES_PASSWORD: lingua_admin
          POSTGRES_DB: lingua_lab
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lingua_admin -d lingua_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://lingua_app:lingua_app@localhost:5433/lingua_lab"
      DATABASE_ADMIN_URL: "postgresql://lingua_admin:lingua_admin@localhost:5433/lingua_lab"
      REDIS_URL: "redis://localhost:6379"
      AI_SERVICE_URL: ""
      

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The role model (non-superuser lingua_app, RLS-only `authenticated`
      # role, auth.jwt() shim) mirrors docker/postgres/init/00-roles.sql,
      # which the postgres image applies automatically via
      # docker-entrypoint-initdb.d in local/docker-compose dev. GitHub
      # Actions service containers start before checkout, so that file isn't
      # mountable here — apply it explicitly instead, against the same admin
      # role the compose setup uses.
      - name: Bootstrap Postgres roles
        env:
          PGPASSWORD: lingua_admin
        run: |
          psql -h localhost -p 5433 -U lingua_admin -d lingua_lab \
            -v ON_ERROR_STOP=1 -f docker/postgres/init/00-roles.sql

      - name: Apply migrations
        run: pnpm db:migrate

      # Not auto-generated by Drizzle (.claude/rules/data-model.md) — must be
      # applied as a separate step, same as local dev and docker-compose.
      - name: Apply RLS policies
        run: pnpm rls:apply

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Cross-tenant isolation through the real Drizzle connection
      # (packages/db/src/rls-tests/**), not a mocked one. AGENTS.md Iron
      # Law 1 / Iron Law 11.
      - name: RLS isolation suite
        run: pnpm test:rls

      # server/** and app/** route-handler tests — these mock @lingua/db, so
      # they don't depend on the service container above.
      - name: App + server tests
        run: pnpm test:app

      - name: Build
        run: pnpm build
